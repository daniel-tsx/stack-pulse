name: Agent workflow integrity

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-workflow-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-workflow:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      # These checks need neither application dependencies nor credentials.
      - run: node scripts/sync-agent-skills.mjs --check
      - run: node --test tests/agent-skills-sync.test.mjs
