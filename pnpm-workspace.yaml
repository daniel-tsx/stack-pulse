allowBuilds:
  # sentry-cli binary is only needed for source map upload; we don't upload.
  '@sentry/cli': false
  esbuild: false
  msw: false
  sharp: false
  unrs-resolver: false
minimumReleaseAge: 0
overrides:
  # Patched transitive build-tool releases; selectors preserve each declared major.
  'brace-expansion@1': 1.1.18
  'brace-expansion@5': 5.0.9
  esbuild: ^0.25.12
  # >=8.5.23 carries the fix for the source-map path traversal advisories.
  postcss: ^8.5.26
