<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description">
  <title id="title">StackPulse — release intelligence architecture</title>
  <desc id="description">Vercel Cron triggers the Next.js ingestion handler twice daily. The handler fetches GitHub releases, skips drafts and duplicates, calls OpenRouter for a structured summary, validates the returned JSON with Zod, and writes through Drizzle to Neon Postgres. Next.js server components and the releases API query the database to serve the React release feed. Checks include all registry stacks and followed custom repositories.</desc>
  <metadata>Current implementation, verified 2026-10-07. Adapted from docs/architecture/system-overview.html, docs/DESIGN_SYSTEM.md, and the release ingestion, AI, database, and feed source files. This is a release data-flow view; see README.md in this directory for scope and source references.</metadata>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#26262e"/>
    </pattern>
    <marker id="arrow-lime" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M1 1 9 5 1 9" fill="none" stroke="#a3e635" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M1 1 9 5 1 9" fill="none" stroke="#67e8f9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .mono { font-family: Consolas, 'DejaVu Sans Mono', monospace; }
      .sans { font-family: Arial, 'DejaVu Sans', sans-serif; }
      .ink { fill: #e8e8ec; }
      .dust { fill: #9b9ba1; }
      .lime { fill: #a3e635; }
      .cyan { fill: #67e8f9; }
      .panel { fill: #0d0d10; stroke: #34343d; stroke-width: 1.5; }
      .flow { fill: none; stroke: #a3e635; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; marker-end: url(#arrow-lime); }
      .llm-flow { fill: none; stroke: #67e8f9; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; marker-end: url(#arrow-cyan); }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="#08080a"/>
  <rect x="68" y="304" width="1784" height="660" fill="url(#grid)" opacity="0.42"/>

  <!-- Existing Beat Stack mark, with its original geometry and palette. -->
  <g transform="translate(96 58) scale(1.75)">
    <rect x="0.5" y="0.5" width="31" height="31" rx="7" fill="#0d0d10" stroke="#26262e"/>
    <path d="M6 24H26" fill="none" stroke="#a3e635" stroke-opacity="0.34" stroke-linecap="round"/>
    <path d="M6 24V16.3 M11 24V12.1 M16 24V10 M21 24V14.2 M26 24V17.7" fill="none" stroke="#a3e635" stroke-width="2.7" stroke-linecap="round"/>
    <circle cx="16" cy="5.35" r="2.3" fill="#a3e635"/>
  </g>
  <text x="174" y="100" class="mono ink" font-size="38" font-weight="700" letter-spacing="-1">stack<tspan class="lime">.</tspan>pulse</text>
  <text x="1824" y="92" class="mono dust" font-size="21" text-anchor="end" letter-spacing="3">SYSTEM ARCHITECTURE</text>
  <path d="M96 140H1824" stroke="#26262e"/>
  <text x="96" y="230" class="mono ink" font-size="68" font-weight="700" letter-spacing="-3">release intelligence<tspan class="lime">.</tspan></text>
  <text x="98" y="278" class="sans dust" font-size="27">Scheduled GitHub checks. AI summaries. One release feed.</text>

  <!-- Scheduled trigger enters application processing, rather than GitHub. -->
  <rect x="96" y="350" width="310" height="170" rx="14" class="panel"/>
  <g transform="translate(126 382)" fill="none" stroke="#a3e635" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="15" cy="15" r="14"/>
    <path d="M15 6V15L22 19"/>
  </g>
  <text x="173" y="406" class="sans ink" font-size="32" font-weight="700">Vercel Cron</text>
  <text x="126" y="457" class="mono dust" font-size="23">00:00 / 12:00 UTC</text>
  <text x="126" y="492" class="sans dust" font-size="23">Scheduled release checks</text>
  <path d="M406 435H450Q462 435 462 447V664Q462 676 474 676H520" class="flow"/>

  <!-- An external LLM call returns to the handler before validation and insert. -->
  <rect x="1050" y="350" width="328" height="170" rx="14" class="panel"/>
  <g transform="translate(1080 381)" fill="none" stroke="#67e8f9" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 15H12M12 15 22 5H31M12 15 22 25H31"/>
    <path d="m26 0 5 5-5 5M26 20l5 5-5 5"/>
  </g>
  <text x="1127" y="406" class="sans ink" font-size="32" font-weight="700">OpenRouter</text>
  <text x="1080" y="457" class="sans ink" font-size="26">LLM summarization</text>
  <text x="1080" y="492" class="sans dust" font-size="23">via OpenAI SDK</text>
  <path d="M826 620V448Q826 436 838 436H1050" class="llm-flow"/>
  <text x="938" y="414" class="mono cyan" font-size="22" text-anchor="middle">release notes</text>
  <path d="M1190 520V550Q1190 562 1178 562H922Q910 562 910 574V620" class="llm-flow"/>
  <text x="1056" y="549" class="mono cyan" font-size="22" text-anchor="middle">JSON summary</text>

  <!-- Main release data flow. -->
  <text x="96" y="591" class="mono dust" font-size="20" letter-spacing="2">01 / SOURCE</text>
  <text x="520" y="591" class="mono dust" font-size="20" letter-spacing="2">02 / PROCESS</text>
  <text x="1050" y="591" class="mono dust" font-size="20" letter-spacing="2">03 / PERSIST</text>

  <rect x="96" y="620" width="310" height="300" rx="14" class="panel"/>
  <g transform="translate(126 651)" fill="none" stroke="#e8e8ec" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 0V25Q3 31 9 31H27M27 3V11Q27 17 21 17H3"/>
    <circle cx="3" cy="0" r="4" fill="#0d0d10"/>
    <circle cx="27" cy="3" r="4" fill="#0d0d10"/>
    <circle cx="27" cy="31" r="4" fill="#0d0d10"/>
  </g>
  <text x="126" y="742" class="sans ink" font-size="37" font-weight="700">GitHub</text>
  <text x="126" y="785" class="sans ink" font-size="33" font-weight="700">Releases API</text>
  <text x="126" y="837" class="sans dust" font-size="24">Tags + release notes</text>
  <text x="126" y="879" class="mono dust" font-size="21">5 latest / repo</text>
  <path d="M406 770H520" class="flow"/>
  <text x="463" y="749" class="mono lime" font-size="21" text-anchor="middle">releases</text>

  <rect x="520" y="620" width="414" height="300" rx="14" fill="#0d0d10" stroke="#a3e635" stroke-opacity="0.66" stroke-width="1.5"/>
  <g transform="translate(550 650)" fill="none" stroke="#a3e635" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="m0 1 10 10L0 21M17 21H32"/>
  </g>
  <text x="601" y="674" class="mono lime" font-size="23">Next.js on Vercel</text>
  <text x="550" y="741" class="sans ink" font-size="37" font-weight="700">Release ingestion</text>
  <text x="550" y="787" class="sans dust" font-size="24">Skip drafts + duplicates</text>
  <path d="M550 814H904" stroke="#26262e"/>
  <text x="550" y="855" class="sans ink" font-size="25">Zod validation</text>
  <text x="550" y="891" class="sans dust" font-size="24">Drizzle writes</text>
  <path d="M934 770H1050" class="flow"/>
  <text x="992" y="749" class="mono lime" font-size="21" text-anchor="middle">insert</text>

  <rect x="1050" y="620" width="328" height="300" rx="14" class="panel"/>
  <g transform="translate(1080 649)" fill="none" stroke="#e8e8ec" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="17" cy="7" rx="17" ry="7"/>
    <path d="M0 7V31C0 40 34 40 34 31V7M0 19C0 28 34 28 34 19"/>
  </g>
  <text x="1080" y="741" class="sans ink" font-size="37" font-weight="700">Neon Postgres</text>
  <text x="1080" y="787" class="sans dust" font-size="24">Summaries + raw notes</text>
  <path d="M1080 814H1348" stroke="#26262e"/>
  <text x="1080" y="855" class="sans ink" font-size="25">Fetch run history</text>
  <text x="1080" y="891" class="mono dust" font-size="21">Drizzle / neon-http</text>
  <path d="M1378 770H1494" class="flow"/>
  <text x="1436" y="749" class="mono lime" font-size="21" text-anchor="middle">feed</text>

  <!-- The final surface is the existing feed, represented without invented data. -->
  <rect x="1494" y="350" width="330" height="570" rx="14" class="panel"/>
  <path d="M1494 400H1824" stroke="#26262e"/>
  <circle cx="1520" cy="375" r="4.5" fill="#fb7185"/>
  <circle cx="1538" cy="375" r="4.5" fill="#fbbf24"/>
  <circle cx="1556" cy="375" r="4.5" fill="#34d399"/>
  <text x="1799" y="383" class="mono dust" font-size="19" text-anchor="end">04 / SERVE</text>
  <text x="1518" y="457" class="sans ink" font-size="37" font-weight="700">Next.js 16 UI</text>
  <text x="1518" y="493" class="mono dust" font-size="22">/dashboard · /stacks</text>

  <rect x="1518" y="529" width="282" height="279" rx="8" fill="#131318" stroke="#26262e"/>
  <text x="1536" y="567" class="mono ink" font-size="26" font-weight="700">your feed<tspan class="lime">.</tspan></text>
  <path d="M1536 590H1782" stroke="#34343d"/>
  <path d="M1543 618V759" stroke="#34343d" stroke-width="2"/>
  <circle cx="1543" cy="634" r="5" fill="#fb7185"/>
  <rect x="1561" y="618" width="113" height="31" rx="5" fill="#fb7185" fill-opacity="0.1" stroke="#fb7185" stroke-opacity="0.3"/>
  <text x="1572" y="639" class="mono" fill="#fb7185" font-size="19">breaking</text>
  <path d="M1561 669H1766M1561 683H1728" stroke="#9b9ba1" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round"/>
  <circle cx="1543" cy="726" r="5" fill="#34d399"/>
  <rect x="1561" y="710" width="101" height="31" rx="5" fill="#34d399" fill-opacity="0.1" stroke="#34d399" stroke-opacity="0.3"/>
  <text x="1572" y="731" class="mono" fill="#34d399" font-size="19">feature</text>
  <path d="M1561 761H1766M1561 775H1700" stroke="#9b9ba1" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round"/>
  <text x="1518" y="855" class="sans ink" font-size="25">RSC + React</text>
  <text x="1518" y="891" class="sans dust" font-size="23">Filters + read state</text>

  <path d="M96 967H1824" stroke="#26262e"/>
  <circle cx="104" cy="1007" r="5" fill="#a3e635"/>
  <text x="126" y="1015" class="sans dust" font-size="24">All registry stacks + followed custom repos</text>
  <text x="1824" y="1015" class="mono dust" font-size="21" text-anchor="end">Eastbase Studio</text>
</svg>
